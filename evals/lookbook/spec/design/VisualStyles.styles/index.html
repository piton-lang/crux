<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Library · Brightwork</title>
<style>
:root { --bg: #f4f4f2; --surface: #fff; --text: #1a1a1a; --muted: #5c5c5c; --line: #d9d9d6; --accent: #1f4fd1; --fav: #17784a; --rej: #b3261e; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 18px; margin: 0; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
.grow { flex: 1; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.jump { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.jump input { width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
main { padding: 24px; }
.run h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
.run + .run { margin-top: 40px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card button.open { all: unset; cursor: pointer; display: block; position: relative; height: 280px; overflow: hidden; border-bottom: 1px solid var(--line); background: #eee; }
.card button.open:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.card iframe { width: 1280px; height: 1100px; border: 0; transform: scale(0.3); transform-origin: 0 0; pointer-events: none; }
.card .body { padding: 14px 16px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.no { font-size: 44px; font-weight: 800; line-height: 1; grid-row: span 3; }
.name { font-weight: 700; font-size: 17px; }
.idea { color: var(--muted); font-size: 14px; }
.verdict { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.verdict.favoured { color: var(--fav); } .verdict.rejected { color: var(--rej); } .verdict.unrated { color: var(--muted); }
.empty { color: var(--muted); }

/* Large view */
.lv { position: fixed; inset: 0; background: rgba(20, 20, 20, 0.92); z-index: 10; display: none; flex-direction: column; }
.lv.on { display: flex; }
.lv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; color: #fff; }
.lv-bar .t { font-weight: 700; margin-right: 8px; }
.lv-bar button, .lv-bar a { background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; font-size: 14px; }
.lv-bar button[aria-pressed="true"] { background: #fff; color: #111; }
.lv-stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 0 16px 16px; }
.lv-stage iframe { background: #fff; border: 0; height: 100%; width: 100%; max-width: 100%; border-radius: 4px; }
@media (max-width: 600px) { header.top { padding: 12px 16px; } main { padding: 16px; } .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div><h1>Brightwork style library</h1><p>Styles in one run draw the same screen. Click a card to open it large.</p></div>
  <span class="grow"></span>
  <div class="filters" role="group" aria-label="Filter by verdict">
    <button aria-pressed="true" data-f="all">All</button>
    <button aria-pressed="false" data-f="favoured">Favoured</button>
    <button aria-pressed="false" data-f="unrated">Unrated</button>
    <button aria-pressed="false" data-f="rejected">Rejected</button>
  </div>
  <label class="jump">Open number <input id="jump" inputmode="numeric" placeholder="e.g. 2" aria-label="Style number, press Enter to open"></label>
</header>
<main id="runs"></main>

<div class="lv" id="lv" role="dialog" aria-modal="true" aria-label="Large view">
  <div class="lv-bar">
    <span class="t" id="lv-title"></span>
    <button data-w="100%" aria-pressed="true">Wide</button>
    <button data-w="820px" aria-pressed="false">Tablet</button>
    <button data-w="375px" aria-pressed="false">Phone 375</button>
    <span class="grow"></span>
    <button id="lv-prev" aria-label="Previous style">← Prev</button>
    <button id="lv-next" aria-label="Next style">Next →</button>
    <a id="lv-open" href="#" target="_blank" rel="noopener">Open page</a>
    <button id="lv-close" aria-label="Close large view (Escape)">Close ✕</button>
  </div>
  <div class="lv-stage"><iframe id="lv-frame" title="Style page"></iframe></div>
</div>

let filter = "all", current = null, lastFocus = null;
const runsEl = document.getElementById("runs");

function visible() { return STYLES.filter(s => filter === "all" || s.verdict === filter); }

function render() {
  runsEl.innerHTML = "";
  const runNos = [...new Set(STYLES.map(s => s.run))].sort((a, b) => b - a);
  let shown = 0;
  for (const r of runNos) {
    const items = visible().filter(s => s.run === r).sort((a, b) => a.no - b.no);
    if (!items.length) continue;
    shown += items.length;
    const sec = document.createElement("section");
    sec.className = "run";
    sec.innerHTML = `<h2>${RUNS[r] || "Run " + r}</h2><ul class="cards"></ul>`;
    const ul = sec.querySelector("ul");
    for (const s of items) {
      const li = document.createElement("li");
      li.className = "card";
      li.innerHTML = `<button class="open" aria-label="Open style ${s.no}, ${s.name}, large"><iframe src="${s.no}.html" title="Preview of style ${s.no}" loading="lazy" tabindex="-1"></iframe></button>
        <div class="body"><span class="no">${s.no}</span><span class="name">${s.name}</span><span class="idea">${s.idea}</span><span class="verdict ${s.verdict}">${s.verdict}</span></div>`;
      li.querySelector("button").addEventListener("click", () => openLarge(s.no));
      ul.appendChild(li);
    }
    runsEl.appendChild(sec);
  }
  if (!shown) runsEl.innerHTML = `<p class="empty">No styles match this filter.</p>`;
}

document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

const lv = document.getElementById("lv"), frame = document.getElementById("lv-frame");
function order() { return [...STYLES].sort((a, b) => b.run - a.run || a.no - b.no); }
function openLarge(no) {
  const s = STYLES.find(x => x.no === no);
  if (!s) return;
  if (!lv.classList.contains("on")) lastFocus = document.activeElement;
  current = no;
  frame.src = `${no}.html`;
  document.getElementById("lv-title").textContent = `${s.no} · ${s.name} · ${s.verdict}`;
  document.getElementById("lv-open").href = `${no}.html`;
  lv.classList.add("on");
  document.getElementById("lv-close").focus();
}
function closeLarge() { lv.classList.remove("on"); frame.src = "about:blank"; current = null; if (lastFocus) lastFocus.focus(); }
function step(d) { const o = order(); const i = o.findIndex(s => s.no === current); openLarge(o[(i + d + o.length) % o.length].no); }
document.getElementById("lv-close").addEventListener("click", closeLarge);
document.getElementById("lv-prev").addEventListener("click", () => step(-1));
document.getElementById("lv-next").addEventListener("click", () => step(1));
document.querySelectorAll(".lv-bar [data-w]").forEach(b => b.addEventListener("click", () => {
  frame.style.width = b.dataset.w;
  document.querySelectorAll(".lv-bar [data-w]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
document.addEventListener("keydown", e => {
  if (!lv.classList.contains("on")) return;
  if (e.key === "Escape") closeLarge();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
document.getElementById("jump").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const n = parseInt(e.target.value, 10);
  if (STYLES.some(s => s.no === n)) { openLarge(n); e.target.value = ""; }
  else e.target.setCustomValidity("No style with that number"), e.target.reportValidity(), setTimeout(() => e.target.setCustomValidity(""), 1500);
});
render();
